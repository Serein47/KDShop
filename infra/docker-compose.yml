# KDShop 本地基础设施
# 用法：docker compose --env-file .env up -d
# 端口映射一律走环境变量，避免与本机已装的 MySQL(3306) 冲突。

name: kdshop

services:
  mysql:
    image: mysql:8
    container_name: kdshop-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-kdshop}
      MYSQL_USER: ${MYSQL_USER:-kdshop}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-kdshop123}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - kdshop-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  redis:
    image: redis:7
    container_name: kdshop-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redis123}"]
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - kdshop-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    container_name: kdshop-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kdshop}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-kdshop123}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - kdshop-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    container_name: kdshop-mailpit
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "${SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  kdshop-mysql:
  kdshop-redis:
  kdshop-minio:
