spring:
  application:
    name: kdshop-backend
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3307}/${DB_NAME:kdshop}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:kdshop}
    password: ${DB_PASSWORD:kdshop123}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:redis123}
      timeout: 2s
  session:
    store-type: redis
    timeout: 30m
  mail:
    host: ${MAIL_HOST:127.0.0.1}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deletedAt
      logic-delete-value: "now()"
      logic-not-delete-value: "null"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.kdshop: DEBUG

kdshop:
  payment:
    secret: ${PAY_SECRET:dev-secret-change-me}
  mail:
    # 生产默认只写 outbox，不触达真实邮箱；本地 profile 覆盖为 SMTP
    mode: ${MAIL_MODE:OUTBOX_ONLY}
    from: ${MAIL_FROM:no-reply@kdshop.local}
    from-name: ${MAIL_FROM_NAME:KDShop}
    base-url: ${WEB_BASE_URL:http://localhost:5173}
    max-attempts: ${MAIL_MAX_ATTEMPTS:3}
    retry-delay-seconds: ${MAIL_RETRY_DELAY_SECONDS:60}
    batch-size: ${MAIL_BATCH_SIZE:20}
    dispatch-interval-ms: ${MAIL_DISPATCH_INTERVAL_MS:5000}
    initial-delay-ms: ${MAIL_INITIAL_DELAY_MS:3000}
  meta:
    currency: CNY
    timezone: Asia/Shanghai
    shipping-free-threshold-cent: 9900
    shipping-fee-cent: 1000
    pay-timeout-minutes: 15
    auto-confirm-days: 15
    settlement-protection-days: 7
