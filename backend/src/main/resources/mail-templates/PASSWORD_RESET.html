<!doctype html>
<html lang="zh-CN">
<body style="margin:0;padding:0;background:#faf6ef;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;color:#191512;">
  <div style="max-width:560px;margin:0 auto;padding:36px 24px;">
    <div style="font-family:Georgia,'Songti SC',serif;font-size:20px;letter-spacing:6px;color:#d9480f;margin-bottom:28px;">KDShop</div>
    <div style="background:#ffffff;border:1px solid #ebe0d1;border-radius:16px;padding:32px;">
      <h1 style="font-size:24px;margin:0 0 16px;font-family:Georgia,'Songti SC',serif;">重置你的密码</h1>
      <p style="font-size:14px;line-height:1.8;margin:0 0 12px;">{{nickname}}，我们收到了重置密码的请求。</p>
      <p style="font-size:14px;line-height:1.8;margin:0 0 24px;">点击下面的按钮设置新密码：</p>
      <p style="margin:0 0 24px;">
        <a href="{{resetUrl}}" style="display:inline-block;background:#d9480f;color:#ffffff;text-decoration:none;padding:12px 26px;border-radius:999px;font-size:14px;">重置密码</a>
      </p>
      <p style="font-size:12px;line-height:1.8;color:#8a7d6c;margin:0 0 6px;">链接 {{expireMinutes}} 分钟内有效。若非本人操作，请忽略这封邮件，你的密码不会被修改。</p>
      <p style="font-size:12px;line-height:1.8;color:#8a7d6c;margin:0;">本邮件由系统自动发送，请勿直接回复。若不想再收到，请联系客服退订。</p>
    </div>
  </div>
</body>
</html>
