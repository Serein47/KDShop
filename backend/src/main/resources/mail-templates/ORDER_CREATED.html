<!doctype html>
<html lang="zh-CN">
<body style="margin:0;padding:0;background:#faf6ef;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;color:#191512;">
  <div style="max-width:560px;margin:0 auto;padding:36px 24px;">
    <div style="font-family:Georgia,'Songti SC',serif;font-size:20px;letter-spacing:6px;color:#d9480f;margin-bottom:28px;">KDShop</div>
    <div style="background:#ffffff;border:1px solid #ebe0d1;border-radius:16px;padding:32px;">
      <h1 style="font-size:24px;margin:0 0 16px;font-family:Georgia,'Songti SC',serif;">订单已创建</h1>
      <p style="font-size:14px;line-height:1.8;margin:0 0 6px;">订单号：{{orderNo}}</p>
      <div style="font-size:13px;line-height:1.9;color:#4a4137;margin:16px 0;padding:14px 16px;background:#faf6ef;border-radius:10px;">{{items}}</div>
      <p style="font-size:20px;font-weight:700;color:#d9480f;margin:0 0 24px;">应付 ¥{{payAmount}}</p>
      <p style="margin:0 0 24px;">
        <a href="{{payUrl}}" style="display:inline-block;background:#d9480f;color:#ffffff;text-decoration:none;padding:12px 26px;border-radius:999px;font-size:14px;">去支付</a>
      </p>
      <p style="font-size:12px;line-height:1.8;color:#8a7d6c;margin:0 0 6px;">请在 {{payDeadline}} 前完成支付，超时订单会自动取消并释放库存。</p>
      <p style="font-size:12px;line-height:1.8;color:#8a7d6c;margin:0;">本邮件由系统自动发送，请勿直接回复。若不想再收到，请联系客服退订。</p>
    </div>
  </div>
</body>
</html>
