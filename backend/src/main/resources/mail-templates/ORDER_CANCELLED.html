<!doctype html>
<html lang="zh-CN">
<body style="margin:0;padding:0;background:#faf6ef;font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;color:#191512;">
  <div style="max-width:560px;margin:0 auto;padding:36px 24px;">
    <div style="font-family:Georgia,'Songti SC',serif;font-size:20px;letter-spacing:6px;color:#d9480f;margin-bottom:28px;">KDShop</div>
    <div style="background:#ffffff;border:1px solid #ebe0d1;border-radius:16px;padding:32px;">
      <h1 style="font-size:24px;margin:0 0 16px;font-family:Georgia,'Songti SC',serif;">订单已取消</h1>
      <p style="font-size:14px;line-height:1.8;margin:0 0 6px;">订单号：{{orderNo}}</p>
      <p style="font-size:13px;line-height:1.9;color:#4a4137;margin:16px 0;padding:14px 16px;background:#faf6ef;border-radius:10px;">
        取消原因：{{reason}}<br />
        取消时间：{{cancelledAt}}
      </p>
      <p style="font-size:13px;line-height:1.9;color:#4a4137;margin:0 0 24px;">
        这笔订单在支付时限内没有完成付款，已自动取消，锁定库存与使用的优惠券均已释放。
      </p>
      <p style="margin:0 0 24px;">
        <a href="{{orderUrl}}" style="display:inline-block;background:#d9480f;color:#ffffff;text-decoration:none;padding:12px 26px;border-radius:999px;font-size:14px;">查看订单</a>
      </p>
      <p style="font-size:12px;line-height:1.8;color:#8a7d6c;margin:0;">还想买的话重新下单即可。本邮件由系统自动发送，请勿直接回复。</p>
    </div>
  </div>
</body>
</html>
